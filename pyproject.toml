[project]
name = "pm25-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matheus Mello", email = "matheusmellocunha@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "maturin>=1.15.0",
    "pandas>=2.3.3",
